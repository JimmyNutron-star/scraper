# .github/workflows/odibets_scraper.yml
name: Odibets Integrated Scraper

on:
  schedule:
    # Run at specific times (adjust based on when matches start)
    # This example runs at 10:00 AM, 2:00 PM, and 6:00 PM UTC
    - cron: '0 10,14,18 * * *'
  
  # Allow manual trigger from GitHub UI
  workflow_dispatch:
    inputs:
      mode:
        description: 'Scraping mode'
        required: true
        default: 'full'
        type: choice
        options:
          - full
          - goals_only
          - live_only
          - results_only

jobs:
  scrape:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4  # Updated to v4
    
    - name: Set up Python
      uses: actions/setup-python@v5  # Updated to v5
      with:
        python-version: '3.11'
        cache: 'pip'  # Added caching for faster installs
    
    - name: Install Chrome
      run: |
        sudo apt-get update
        sudo apt-get install -y google-chrome-stable
        chrome --version
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Run Odibets Scraper
      env:
        SCRAPING_MODE: ${{ github.event.inputs.mode || 'full' }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        python odibets_github_scraper.py
      continue-on-error: true  # Continue even if script fails to still upload artifacts
    
    - name: Upload scraping results
      uses: actions/upload-artifact@v4  # Updated to v4
      with:
        name: odibets-scraped-data-${{ github.run_id }}
        path: odibets_scraped_data/
        retention-days: 30
        if-no-files-found: warn  # Warn if no files found instead of failing
    
    - name: Commit and push results
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add odibets_scraped_data/
        # Only commit if there are changes
        if git diff --staged --quiet; then
          echo "No changes to commit"
        else
          git commit -m "Add scraped data for $(date +'%Y-%m-%d %H:%M') [skip ci]"
          git push
        fi
      continue-on-error: true
    
    - name: Send notification on failure
      if: failure()
      run: |
        echo "::error::Scraping job failed! Check the logs for details."
