# .github/workflows/odibets_scraper.yml
name: Odibets Integrated Scraper

on:
  schedule:
    # Run at specific times (adjust based on when matches start)
    - cron: '0 10,14,18 * * *'
  
  # Allow manual trigger from GitHub UI
  workflow_dispatch:
    inputs:
      mode:
        description: 'Scraping mode'
        required: true
        default: 'full'
        type: choice
        options:
          - full
          - goals_only
          - live_only
          - results_only

jobs:
  scrape:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'
    
    - name: Install Chrome
      run: |
        sudo apt-get update
        sudo apt-get install -y google-chrome-stable
        google-chrome --version
    
    - name: Install ChromeDriver
      run: |
        # Get Chrome version
        CHROME_VERSION=$(google-chrome --version | grep -oP '\d+\.\d+\.\d+\.\d+' | head -1)
        echo "Chrome version: $CHROME_VERSION"
        
        # Install matching ChromeDriver
        sudo apt-get install -y unzip
        wget -q "https://storage.googleapis.com/chrome-for-testing-public/${CHROME_VERSION}/linux64/chromedriver-linux64.zip"
        unzip -q chromedriver-linux64.zip
        sudo mv chromedriver-linux64/chromedriver /usr/local/bin/
        sudo chmod +x /usr/local/bin/chromedriver
        chromedriver --version
    
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        # Install from requirements.txt in the GIT folder
        pip install -r GIT/requirements.txt
    
    - name: Run Odibets Scraper
      env:
        SCRAPING_MODE: ${{ github.event.inputs.mode || 'full' }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        DISPLAY: :99
      working-directory: ./GIT  # This is the key change - set working directory to GIT folder
      run: |
        python s2.py
      continue-on-error: true
    
    - name: Upload scraping results
      uses: actions/upload-artifact@v4
      with:
        name: odibets-scraped-data-${{ github.run_id }}
        path: GIT/odibets_scraped_data/  # Updated path to include GIT folder
        retention-days: 30
        if-no-files-found: warn
    
    - name: Commit and push results
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add GIT/odibets_scraped_data/
        if git diff --staged --quiet; then
          echo "No changes to commit"
        else
          git commit -m "Add scraped data for $(date +'%Y-%m-%d %H:%M') [skip ci]"
          git push
        fi
      continue-on-error: true
