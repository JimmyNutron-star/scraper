# .github/workflows/odibets_scraper.yml
name: Odibets Integrated Scraper

on:
  schedule:
    # Run at specific times (adjust based on when matches start)
    # This example runs at 10:00 AM, 2:00 PM, and 6:00 PM UTC
    - cron: '0 10,14,18 * * *'
  
  # Allow manual trigger from GitHub UI
  workflow_dispatch:
    inputs:
      mode:
        description: 'Scraping mode'
        required: true
        default: 'full'
        type: choice
        options:
          - full
          - goals_only
          - live_only
          - results_only

jobs:
  scrape:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install Chrome
      run: |
        sudo apt-get update
        sudo apt-get install -y google-chrome-stable
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install selenium webdriver-manager
    
    - name: Run Odibets Scraper
      env:
        SCRAPING_MODE: ${{ github.event.inputs.mode || 'full' }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        python odibets_github_scraper.py
    
    - name: Upload scraping results
      uses: actions/upload-artifact@v3
      with:
        name: odibets-scraped-data
        path: odibets_scraped_data/
        retention-days: 30
    
    - name: Commit and push results (optional)
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add odibets_scraped_data/
        git diff --quiet && git diff --staged --quiet || git commit -m "Add scraped data [skip ci]"
        git push
      continue-on-error: true
